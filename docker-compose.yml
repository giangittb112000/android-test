services:
  android:
    image: budtmo/docker-android:emulator_14.0
    container_name: android-test
    privileged: true

    devices:
      - /dev/kvm:/dev/kvm

    expose:
      - "6080"
      - "5555"

    environment:
      EMULATOR_DEVICE: "Samsung Galaxy S10"
      WEB_VNC: "true"

    volumes:
      - ./apk:/apk